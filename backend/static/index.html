/* ══ API ══ */
const API="/api";

/* ══ Answer with code blocks ══ */
function Ans({text}) {
  if (!text) return null;
  const parts = text.split(/(```[\s\S]*?```)/g);
  return React.createElement('div', null,
    parts.map((p, i) => {
      if (p.startsWith('```')) {
        const lines = p.slice(3, -3);
        const nl = lines.indexOf('\n');
        const code = nl > -1 ? lines.slice(nl + 1) : lines;
        return React.createElement('pre', {key:i, style:{background:'#1e1e2e',color:'#cdd6f4',padding:'14px 16px',borderRadius:10,fontSize:13,lineHeight:1.6,margin:'6px 0 10px',fontFamily:"'JetBrains Mono',monospace",border:'1px solid #313244',whiteSpace:'pre-wrap',wordBreak:'break-word',overflowX:'auto'}},

}

  if(!r.ok)throw new Error(`API ${r.status}`);setPg("解析...");const d=await r.json();

    err&&React.createElement('div',{style:{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:8,padding:'8px 12px',fontSize:13,color:'#dc2626',marginBottom:12}},err),
    pg&&React.createElement('div',{style:{background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:8,padding:'8px 12px',fontSize:13,color:'#2563eb',marginBottom:12}},pg),
