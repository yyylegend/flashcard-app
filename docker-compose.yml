services:
  db:
    image: postgres:16-alpine
    container_name: flashcard-db
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${PG_DB:-flashcards}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: flashcard-backend
    env_file:
      - ./backend/.env
    environment:
      - FLASK_ENV=production
      - PG_HOST=db
      - PG_PORT=5432
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    container_name: flashcard-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
